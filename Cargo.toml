[package]
name = "playgama-bridge"
version = "0.1.2"
edition = "2024"
license = "MPL-2.0"
authors = ["mlm-games"]
description = "Rust binding for the Playgama Bridge web SDK: platform messages, ads, cloud storage, social, leaderboards, payments, achievements and remote config."
repository = "https://github.com/mlm-games/playgama-bridge"
readme = "README.md"
keywords = ["gamedev", "web", "wasm", "playgama", "bridge"]
categories = ["game-development", "web-programming"]
rust-version = "1.98"

[dependencies]
serde = "1"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlHeadElement", "HtmlScriptElement", "Window"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
